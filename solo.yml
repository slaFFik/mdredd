name: mdredd
icon: null
processes:
  npm:test:
    command: npm run test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  npm:build:
    command: npm run build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  format & lint:
    command: npm run format:check && npm run lint
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  typecheck:
    command: npm run typecheck
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  npm:dev:
    command: npm run dev
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
